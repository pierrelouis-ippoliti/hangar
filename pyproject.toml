[project]
name = "hangar"
version = "0.0.0a0.dev0"
description = "A RAG system over the FAA maintenance handbooks and Transport Canada's maintenance rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hangar = "hangar.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D"]
# Docstrings put their summary on the line after the opening quotes,
# so D213 replaces D212 (summary on the first line).
extend-select = ["D213"]
ignore = ["D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not model and not llm"]
markers = [
    "model: loads the real BGE-M3 model; run only with -m model",
    "llm: calls the real Mistral API and needs the API key; run only with -m llm",
]
