[project]
name = "hangar"
version = "0.0.0a4"
description = "A RAG system over the FAA maintenance handbooks and Transport Canada's maintenance rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "lxml>=6",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.14",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20",
    "sentence-transformers>=6.3.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
hangar = "hangar.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-lxml>=2026.2.16",
    "types-pyyaml>=6.0.12.20261103",
]
pipeline = [
    "dvc>=3.67.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# DTZ flags datetimes without a time zone.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D", "DTZ"]
# Docstrings put their summary on the line after the opening quotes,
# so D213 replaces D212 (summary on the first line). That holds for short
# docstrings too, so D200 (one-line docstrings on one line) is off, and a
# summary may end without a period (D415).
extend-select = ["D213"]
ignore = ["D212", "D200", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Let mypy check the arguments passed to pydantic models, as it does for
# ordinary classes.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# pypdfium2 ships no type information, so its objects are typed Any. The
# parser turns what it reads into str at once.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# pyarrow ships no type information either. Only the vectors file uses it,
# and its rows are validated as VectorRecord when read.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "hangar"
# Lets the contracts below name third-party libraries.
include_external_packages = true

# A layer may import the layers below it, never those above. Packages in
# parentheses are optional, so the contract holds before they exist.
# Stages on the same line are siblings and may not import each other.
[[tool.importlinter.contracts]]
name = "Layers: cli, pipelines, stages, observability, files and pacing, core"
type = "layers"
layers = [
    "hangar.cli",
    "(hangar.pipelines)",
    "(hangar.retrieval)",
    "(hangar.corpus) | (hangar.parsing) | (hangar.chunking) | (hangar.embedding) | (hangar.indexing) | (hangar.generation) | (hangar.evaluation)",
    "(hangar.observability) | (hangar.files) | (hangar.pacing)",
    "(hangar.core)",
]

# core holds domain types and does no I/O, so stages can rely on it without
# side effects. pathlib stays allowed: core uses Path only as a type.
[[tool.importlinter.contracts]]
name = "core does no I/O"
type = "forbidden"
source_modules = ["hangar.core"]
forbidden_modules = [
    "os",
    "io",
    "shutil",
    "tempfile",
    "glob",
    "socket",
    "subprocess",
    "urllib",
    "http",
    "sqlite3",
]

# The layers above would let cli reach every package; it may use only
# pipelines and observability. It reaches the rest through pipelines,
# so only its own imports are checked.
[[tool.importlinter.contracts]]
name = "cli imports only pipelines and observability"
type = "forbidden"
source_modules = ["hangar.cli"]
allow_indirect_imports = true
forbidden_modules = [
    "hangar.core",
    "hangar.corpus",
    "hangar.parsing",
    "hangar.chunking",
    "hangar.embedding",
    "hangar.indexing",
    "hangar.retrieval",
    "hangar.generation",
    "hangar.evaluation",
    "hangar.files",
]

# retrieval sits above the other stages because it combines the embedder
# and the vector index. It may use only their interfaces: no other stage,
# and none of the adapters, which pipelines builds and passes in.
[[tool.importlinter.contracts]]
name = "retrieval uses only the embedding and indexing interfaces"
type = "forbidden"
source_modules = ["hangar.retrieval"]
allow_indirect_imports = true
forbidden_modules = [
    "hangar.corpus",
    "hangar.parsing",
    "hangar.chunking",
    "hangar.generation",
    "hangar.evaluation",
    "hangar.embedding.st_embedder",
    "hangar.indexing.qdrant",
]

# Adapter libraries stay inside their stage package. Only that package and
# pipelines, which constructs the adapters, may import them. The contract
# checks every module of hangar, so a new package is covered at once; the
# allowed packages are ignored, even before they exist. Indirect imports are
# allowed: cli reaching pypdfium2 through pipelines is fine.
[[tool.importlinter.contracts]]
name = "Only parsing and pipelines import pypdfium2 and lxml"
type = "forbidden"
source_modules = ["hangar"]
forbidden_modules = ["pypdfium2", "lxml"]
ignore_imports = [
    "hangar.parsing.** -> pypdfium2",
    "hangar.parsing.** -> lxml",
    "hangar.pipelines.** -> pypdfium2",
    "hangar.pipelines.** -> lxml",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only chunking and pipelines import tokenizers and huggingface_hub"
type = "forbidden"
source_modules = ["hangar"]
forbidden_modules = ["tokenizers", "huggingface_hub"]
ignore_imports = [
    "hangar.chunking.** -> tokenizers",
    "hangar.chunking.** -> huggingface_hub",
    "hangar.pipelines.** -> tokenizers",
    "hangar.pipelines.** -> huggingface_hub",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only embedding and pipelines import torch and its model libraries"
type = "forbidden"
source_modules = ["hangar"]
forbidden_modules = ["sentence_transformers", "transformers", "torch"]
ignore_imports = [
    "hangar.embedding.** -> sentence_transformers",
    "hangar.embedding.** -> transformers",
    "hangar.embedding.** -> torch",
    "hangar.pipelines.** -> sentence_transformers",
    "hangar.pipelines.** -> transformers",
    "hangar.pipelines.** -> torch",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only indexing and pipelines import qdrant_client"
type = "forbidden"
source_modules = ["hangar"]
forbidden_modules = ["qdrant_client"]
ignore_imports = [
    "hangar.indexing.** -> qdrant_client",
    "hangar.pipelines.** -> qdrant_client",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

# The Mistral adapter calls the API with the standard library, so there is no
# adapter library to fence in. The rule falls on the adapter module instead:
# only pipelines builds it, and the rest of the code sees the LlmClient
# interface. import-linter skips a source module that contains the forbidden
# one, so "hangar" or "hangar.generation" alone would check nothing. The two
# wildcards list every top-level package and every module of generation, new
# ones included.
[[tool.importlinter.contracts]]
name = "Only pipelines imports the Mistral adapter"
type = "forbidden"
source_modules = ["hangar.*", "hangar.generation.*"]
forbidden_modules = ["hangar.generation.mistral"]
ignore_imports = ["hangar.pipelines.** -> hangar.generation.mistral"]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not model and not llm and not corpus"]
markers = [
    "model: loads the real BGE-M3 model; run only with -m model",
    "llm: calls the real Mistral API and needs the API key; run only with -m llm",
    "corpus: reads the downloaded C1 documents in data/raw; run only with -m corpus",
]
