[project]
name = "hangar"
version = "0.0.0a3.dev0"
description = "A RAG system over the FAA maintenance handbooks and Transport Canada's maintenance rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "lxml>=6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
]

[project.scripts]
hangar = "hangar.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-lxml>=2026.2.16",
    "types-pyyaml>=6.0.12.20261103",
]
pipeline = [
    "dvc>=3.67.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D"]
# Docstrings put their summary on the line after the opening quotes,
# so D213 replaces D212 (summary on the first line). That holds for short
# docstrings too, so D200 (one-line docstrings on one line) is off, and a
# summary may end without a period (D415).
extend-select = ["D213"]
ignore = ["D212", "D200", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Let mypy check the arguments passed to pydantic models, as it does for
# ordinary classes.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# pypdfium2 ships no type information, so its objects are typed Any. The
# parser turns what it reads into str at once.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "hangar"
# Lets the contracts below name third-party libraries.
include_external_packages = true

# A layer may import the layers below it, never those above. Packages in
# parentheses are optional, so the contract holds before they exist.
# Stages on the same line are siblings and may not import each other.
[[tool.importlinter.contracts]]
name = "Layers: cli, pipelines, stages, observability and files, core"
type = "layers"
layers = [
    "hangar.cli",
    "(hangar.pipelines)",
    "(hangar.retrieval)",
    "(hangar.corpus) | (hangar.parsing) | (hangar.chunking) | (hangar.embedding) | (hangar.indexing) | (hangar.generation) | (hangar.evaluation)",
    "(hangar.observability) | (hangar.files)",
    "(hangar.core)",
]

# The layers above would let cli reach every package; it may use only
# pipelines and observability. It reaches the rest through pipelines,
# so only its own imports are checked.
[[tool.importlinter.contracts]]
name = "cli imports only pipelines and observability"
type = "forbidden"
source_modules = ["hangar.cli"]
allow_indirect_imports = true
forbidden_modules = [
    "hangar.core",
    "hangar.corpus",
    "hangar.parsing",
    "hangar.chunking",
    "hangar.embedding",
    "hangar.indexing",
    "hangar.retrieval",
    "hangar.generation",
    "hangar.evaluation",
    "hangar.files",
]

# Adapter libraries stay inside their stage package. Only that package and
# pipelines, which constructs the adapters, may import them. The contract
# checks every module of hangar, so a new package is covered at once; the
# allowed packages are ignored, even before they exist. Indirect imports are
# allowed: cli reaching pypdfium2 through pipelines is fine.
[[tool.importlinter.contracts]]
name = "Only parsing and pipelines import pypdfium2 and lxml"
type = "forbidden"
source_modules = ["hangar"]
forbidden_modules = ["pypdfium2", "lxml"]
ignore_imports = [
    "hangar.parsing.** -> pypdfium2",
    "hangar.parsing.** -> lxml",
    "hangar.pipelines.** -> pypdfium2",
    "hangar.pipelines.** -> lxml",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not model and not llm and not corpus"]
markers = [
    "model: loads the real BGE-M3 model; run only with -m model",
    "llm: calls the real Mistral API and needs the API key; run only with -m llm",
    "corpus: reads the downloaded C1 documents in data/raw; run only with -m corpus",
]
