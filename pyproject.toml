[project]
name = "hangar"
version = "0.0.0a1.dev0"
description = "A RAG system over the FAA maintenance handbooks and Transport Canada's maintenance rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
hangar = "hangar.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
pipeline = [
    "dvc>=3.67.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D"]
# Docstrings put their summary on the line after the opening quotes,
# so D213 replaces D212 (summary on the first line).
extend-select = ["D213"]
ignore = ["D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]

[tool.importlinter]
root_package = "hangar"

# A layer may import the layers below it, never those above. Packages in
# parentheses are optional, so the contract holds before they exist.
# Stages on the same line are siblings and may not import each other.
[[tool.importlinter.contracts]]
name = "Layers: cli, pipelines, stages, observability, core"
type = "layers"
layers = [
    "hangar.cli",
    "(hangar.pipelines)",
    "(hangar.retrieval)",
    "(hangar.corpus) | (hangar.parsing) | (hangar.chunking) | (hangar.embedding) | (hangar.indexing) | (hangar.generation) | (hangar.evaluation)",
    "(hangar.observability)",
    "(hangar.core)",
]

# The layers above would let cli reach every package; it may use only
# pipelines and observability.
[[tool.importlinter.contracts]]
name = "cli imports only pipelines and observability"
type = "forbidden"
source_modules = ["hangar.cli"]
forbidden_modules = [
    "hangar.core",
    "hangar.corpus",
    "hangar.parsing",
    "hangar.chunking",
    "hangar.embedding",
    "hangar.indexing",
    "hangar.retrieval",
    "hangar.generation",
    "hangar.evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not model and not llm"]
markers = [
    "model: loads the real BGE-M3 model; run only with -m model",
    "llm: calls the real Mistral API and needs the API key; run only with -m llm",
]
