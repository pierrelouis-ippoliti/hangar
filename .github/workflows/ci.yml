name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          enable-cache: true

      # --locked fails if uv.lock no longer matches pyproject.toml. Only the
      # dev group is installed: CI never runs the DVC pipeline.
      - name: Install from the lock file
        run: uv sync --locked

      # The same target developers run locally, so the two can't drift.
      # The default marker selection leaves out the model and llm tests.
      - name: Lint, format, types, import rules and tests
        run: make check
