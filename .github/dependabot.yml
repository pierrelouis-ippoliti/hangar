version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # The hook versions pinned in .pre-commit-config.yaml, such as gitleaks.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
