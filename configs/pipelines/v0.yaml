# Hangar v0, the naive baseline. This file says what a run does; its
# configuration hash identifies the results. Where things run (data folder,
# Qdrant URL, API key) lives in the environment settings instead.

corpus:
  snapshot: c1
  manifest: corpus/manifest.yaml

parsing:
  pdf:
    type: pypdfium2
  normalisation:
    unicode_form: NFKC
    collapse_whitespace: true
  car:
    subparts: ["571", "573"]
  tc_html:
    # Canada.ca pages put their content in <main>. The HTML parser issue
    # (M2) confirms or narrows these selectors.
    content_selectors:
      standard: main
      advisory_circular: main

chunking:
  type: fixed_tokens
  size: 512
  overlap: 0
  tokenizer: embedder

embedding:
  type: sentence_transformers
  model: BAAI/bge-m3
  # Hugging Face commit of BAAI/bge-m3, the head of main on 2026-11-04.
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  output: dense
  batch_size: 16
  normalize: true

index:
  type: qdrant
  distance: cosine

retrieval:
  type: dense
  top_k: 5

generation:
  type: mistral
  # Mistral Small 4, version 26.03.
  model: mistral-small-2603
  temperature: 0.0
  max_output_tokens: 512
  prompt: answer-v0

run:
  name: v0
  seed: 0
  notes: ""

# US dollars per million tokens. v0 runs on the free tier; the list price
# shows what the same tokens would cost.
prices:
  mistral-small-2603:
    free_tier:
      input_usd_per_million: 0.0
      output_usd_per_million: 0.0
    # From https://docs.mistral.ai/inference/pricing, read on 2026-11-04.
    list_price:
      input_usd_per_million: 0.15
      output_usd_per_million: 0.6
