# The build pipeline: fetch, parse, chunk, embed, index, then the seed run.
# Each stage issue adds its own stage here, with its parameters read from
# configs/pipelines/v0.yaml.
stages:
  # Download every document of the snapshot into data/raw and check its hash.
  # The documents are not Hangar's to redistribute, so DVC doesn't cache
  # them (cache: false), and keeps them between runs (persist: true): fetch
  # skips a file already there with the right hash.
  fetch:
    cmd: hangar fetch --config configs/pipelines/v0.yaml
    deps:
      - corpus/manifest.yaml
    params:
      - configs/pipelines/v0.yaml:
          - corpus
    outs:
      - data/raw:
          cache: false
          persist: true

  # Parse every document into one canonical text split into passages, then
  # check the results against parsing.checks. The parsed files hold the
  # documents' text, so DVC doesn't cache them either. The report is
  # committed to git, so DVC doesn't cache it. The parser code is a
  # dependency: a new parser version reruns the stage.
  parse:
    cmd: hangar parse --config configs/pipelines/v0.yaml
    deps:
      - corpus/manifest.yaml
      - data/raw
      - src/hangar/core/parsed.py
      - src/hangar/parsing
    params:
      - configs/pipelines/v0.yaml:
          - corpus
          - parsing
          - run.name
    outs:
      - data/parsed/c1:
          cache: false
      - results/v0/parse-report.json:
          cache: false

  # Split every parsed document into chunks of at most 512 tokens, counted
  # with BGE-M3's tokenizer. The chunks hold the documents' text, so DVC
  # doesn't cache them. The chunker code is a dependency: a change to it
  # reruns the stage.
  chunk:
    cmd: hangar chunk --config configs/pipelines/v0.yaml
    deps:
      - data/parsed/c1
      - src/hangar/core/chunks.py
      - src/hangar/chunking
    params:
      - configs/pipelines/v0.yaml:
          - corpus.snapshot
          - chunking
          - embedding.model
          - embedding.revision
    outs:
      - data/chunks/c1/fixed512:
          cache: false
